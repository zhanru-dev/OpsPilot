name: Deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPSPILOT_WEB_URL: ${{ vars.OPSPILOT_WEB_URL }}
      OPSPILOT_API_URL: ${{ vars.OPSPILOT_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment URLs
        run: |
          test -n "$OPSPILOT_WEB_URL"
          test -n "$OPSPILOT_API_URL"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
